version: "3.8"

services:
  mysql-db:
    image: mysql:8.0
    container_name: monopoly-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: monopoly_db
      MYSQL_USER: user
      MYSQL_PASSWORD: 1234

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
